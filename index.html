<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Ingresos/Gastos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <header class="container">
        <h1>App ingresos/gastos</h1>

    </header>
    <section class="container">
        <button class="btn btn-success" id="btnNuevo">Nuevo</button>
        <table class="table table-striped table-hover" id="tabla">
  <tr>
    <th>Id</th>
    <th>Concepto</th>
    <th>Cantidad</th>
    <th>Fecha</th>
  </tr>
  <tbody id="cuerpo-tabla">
    <!--Los datos se insertan aqui con javascrip-->
    
  </tbody>

  </table>

  <div><!--Etiqueta de seccion cuando se van a agrupar varias cosas -->
    
    <button class="btn btn-success" id="btnGuardar">Guardar</button>
    <button class="btn btn-warning" id="btnEditar">Editar</button>
    <button class="btn btn-warning" id="btnBorrar">Borrar</button>
    <button class="btn btn-info" id="btnCerrar">Cerrar</button>

  </div>

  <div class="card" style="display: none;" id="formulario">
        <form>
            <input type="hidden" id="id_campo">
            <div class="mb-3">
                <label for="quantity" class="form-label">Cantidad</label>
                <input type="number" class="form-control" id="quantity">
            </div>
            
            <div class="mb-3">
                <label for="concept" class="form-label">Concepto</label>
                <input type="text" class="form-control" id="concept">
            </div>
            
            <div class="mb-3">
                <label for="date" class="form-label">Fecha</label>
                <input type="date" class="form-control" id="date">
            </div>
            
            
            
        
        </form>

    </div>
  
</section>
    <footer class="container">
        @maria-jimenez 
    </footer>

    <script src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
